:root{
  /* Consola de director aéreo: reloj y cuenta regresiva dominan; tablas de plan sobrias debajo. */
  --bg:#eef1f4; --surface:#ffffff; --ink:#13202c; --muted:#566473; --line:#d3dae1;
  --accent:#0b4f8a; --accent-ink:#ffffff;
  --start:#17794a; --go:#17794a; --warn:#a85f00; --crit:#bf2f24; --go-bg:#e2f3ea; --warn-bg:#fbefd9; --crit-bg:#fbe4e1;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e161e; --surface:#17222d; --ink:#e7eef4; --muted:#94a3b1; --line:#2b3947;
    --accent:#74b6ec; --accent-ink:#08243b;
    --start:#3fbf80; --go:#5fd39a; --warn:#f2b453; --crit:#ff8377; --go-bg:#143524; --warn-bg:#3b2c10; --crit-bg:#45201c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e161e; --surface:#17222d; --ink:#e7eef4; --muted:#94a3b1; --line:#2b3947;
  --accent:#74b6ec; --accent-ink:#08243b;
  --start:#3fbf80; --go:#5fd39a; --warn:#f2b453; --crit:#ff8377; --go-bg:#143524; --warn-bg:#3b2c10; --crit-bg:#45201c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums}
#root{max-width:1180px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:26px;font-weight:700;text-transform:uppercase}
h2{font-size:22px;font-weight:600;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px;min-height:38px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.icon{padding:6px 10px;min-width:38px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-height:38px;font-variant-numeric:tabular-nums}
input[aria-invalid="true"]{border-color:var(--crit);background:var(--crit-bg)}

.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.top .id{display:flex;flex-direction:column}
.clock{font-family:var(--display);font-weight:600;font-size:44px;line-height:1}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card > header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}

/* Próximo push */
.hero{border-left:10px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 24px;align-items:center}
.hero .eyebrow{font-family:var(--display);text-transform:uppercase;font-weight:600;font-size:18px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero .who{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.05;text-transform:uppercase}
.hero > *{grid-column:1;min-width:0}
.hero .cdw{grid-row:1 / span 7;grid-column:2;text-align:right;align-self:center}
.hero .flag.big{justify-self:start}
.hero .cd{font-family:var(--display);font-weight:700;font-size:clamp(72px,13vw,150px);line-height:1.02;white-space:nowrap}
.hero .cdl{font-family:var(--display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-top:4px}
.ptit{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1.15;margin-bottom:3px;overflow-wrap:anywhere}
.hero .ptit{font-size:clamp(22px,4.5vw,32px);color:var(--ink)}
.ptit:before{content:"✈ ";color:var(--muted)}
.pushbar .pb-p{font-size:clamp(16px,3vw,24px);font-weight:600;text-transform:uppercase}
.ptn{margin:6px 0 0;padding:8px 12px;border-radius:8px;font-weight:700;border-left:6px solid var(--go);background:var(--go-bg);font-size:15px}
.ptn[data-s="warn"]{border-left-color:var(--warn);background:var(--warn-bg)}
.ptn[data-s="warn"]{font-size:16px}
.ptn[data-s="bad"]{border:1px solid transparent;border-left:6px solid var(--crit);background:var(--crit-bg);color:var(--crit);font-size:17px;font-weight:700}
.hero .ptn{font-size:17px}.hero .ptn[data-s="bad"]{font-size:20px}
@media (prefers-reduced-motion:no-preference){.ptn[data-s="bad"]{animation:alp 1.2s ease-in-out infinite}}
.np{font-size:15px;color:var(--muted);font-weight:700;min-width:96px}
.pasctl{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-top:2px}
.pasctl button{min-height:36px;padding:4px 14px}
input.hms{font-variant-numeric:tabular-nums;letter-spacing:.03em}
.savebar{position:sticky;top:0;z-index:25;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;border-left:10px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.savebar[data-s="ok"]{border-left-color:var(--go)}.savebar[data-s="pend"]{border-left-color:var(--warn)}.savebar[data-s="err"]{border-left-color:var(--crit)}
.savebar .sv-n{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;overflow-wrap:anywhere}
.savebar .sv-st{font-size:15px;font-weight:600}
.savebar[data-s="ok"] .sv-st{color:var(--go)}.savebar[data-s="pend"] .sv-st{color:var(--warn)}.savebar[data-s="err"] .sv-st{color:var(--crit)}
.savebar .sv-b{display:flex;gap:8px;flex-wrap:wrap}.savebar .sv-b button{font-size:18px;padding:12px 24px}

var TIPS={
"Hora de inicio de la ceremonia":"Hora oficial a la que empieza el primer punto de la ceremonia, en formato de 24 horas con segundos. Ejemplo: 10:00:00. Todas las horas del plan se calculan a partir de esta.",
"Preaviso para alistar (s)":"Segundos antes del push en que la pasada empieza a titilar con el letrero «Alistar push» y suena la alerta. Ejemplo: 30 para que le avise medio minuto antes de cada push.",
"Corrección del reloj (s)":"Segundos que se suman a la hora de este dispositivo para igualarla con la hora oficial o GPS. Si el dispositivo va 3 s atrasado, escriba 3. Si va 2 s adelantado, escriba -2. Si coincide, deje 0.",
"Evento abierto":"Evento que está viendo y editando. Elija otro de la lista para abrirlo. Cada evento guarda su propio plan y su registro en este dispositivo.",
"Nombre del evento":"Título con el que se guarda este evento. Ejemplo: Ceremonia aniversario 2026.",
"Separación mínima (s)":"Segundos mínimos entre dos pasadas sobre la tribuna. Si dos pasadas quedan más juntas que esto, aparece una alerta. Ejemplo: 30.",
"Lugar":"Sitio del evento. Sale en la hoja impresa. Ejemplo: CACOM-1, Palanquero.",
"Director aéreo":"Nombre de quien dirige las pasadas (Air Boss). Sale en la hoja impresa.",
"Suplente":"Nombre del director aéreo suplente. Sale en la hoja impresa.",
"Frecuencia táctica":"Frecuencia de radio en la que usted da los push. Sale en la hoja impresa. Ejemplo: 123.45.",
"Frecuencia torre":"Frecuencia de la torre de control del sitio. Sale en la hoja impresa.",
"Alternos":"Aeródromos alternos para las aeronaves. Sale en la hoja impresa.",
"Observaciones":"Notas generales del evento: meteorología mínima, restricciones, coordinaciones. Salen al final de la hoja impresa.",
"Indicativo":"Indicativo de radio del equipo. Es informativo y sale en la hoja impresa. Ejemplo: Halcón 1.",
"Cant.":"Cantidad de aeronaves del equipo. Es informativo y sale en la hoja impresa. Ejemplo: 4.",
"Altitud holding":"Altitud asignada en el holding, para separar equipos que esperan al tiempo. Es informativo y sale en la hoja impresa. Ejemplo: 9.500 ft.",
"En holding antes del inicio (min)":"Minutos antes del inicio de la ceremonia en que todos los equipos deben estar ya en su holding. Recomendado 15; mínimo 10. Ejemplo: 15.",
"Step antes del takeoff (min)":"Minutos entre el step (salida de las tripulaciones hacia las aeronaves) y el takeoff. Ejemplo: 60 para una hora.",
"Margen de alistamiento (min)":"Colchón que se suma al tiempo de vuelo para imprevistos en tierra o en ruta. Adelanta el takeoff esa cantidad de minutos. Ejemplo: 10.",
"Aeródromo de salida":"Aeródromo desde donde despega el equipo. Sale en la tabla de step y takeoff y en la hoja impresa. Ejemplo: SKBO.",
"Playtime (min)":"Minutos que el equipo puede estar en vuelo desde el takeoff, por combustible. La aplicación compara este tiempo con lo que lleva en vuelo cuando pasa sobre la tribuna (desde su takeoff planeado) y avisa en cada pasada si alcanza o no. Escriba solo minutos: 45, o 1:15 para 1 h 15 min. Vacío = no se revisa.",
"Reserva mínima de playtime (min)":"Si al pasar le quedan menos minutos de playtime que esta reserva, la pasada se marca «Playtime justo» en naranja. Con menos de cero se marca «No alcanza» en rojo. Por defecto 5.",
"Distancia (NM)":"Distancia en millas náuticas desde el aeródromo de salida hasta el holding. Cambia para cada equipo según de dónde salga. Con este dato y la velocidad del equipo se calcula el tiempo. Ejemplo: 45.",
"T. manual (min)":"Minutos de vuelo del aeródromo de salida al holding, escritos a mano. Solo se usa si la distancia está en 0, por ejemplo cuando la ruta no es directa. Ejemplo: 12.",
"Tiempo":"Calculado, no se digita. Distancia ÷ velocidad crucero (o la de pasada, si la crucero está en 0). Si la distancia está en 0, es el tiempo manual.",
"Step":"Calculado, no se digita. Hora de takeoff menos los minutos de step.",
"Takeoff":"Calculado, no se digita. Hora en holding − tiempo de vuelo − margen de alistamiento, redondeada hacia abajo al minuto.",
"En holding":"Hora en que el equipo debe estar en su holding. Si la deja vacía se calcula sola: inicio de la ceremonia menos los minutos de anticipación (y se corre si la ceremonia inicia tarde). Si escribe una hora, ese equipo queda fijo en esa hora y de ella salen su takeoff, su step y su playtime; los demás equipos no cambian. Bórrela para volver a automática. Ejemplo: 09:40.",
"N.º":"Orden del punto dentro de la ceremonia. Se cambia con las flechas ↑ y ↓ de la derecha.",
"Punto":"Nombre del punto de la ceremonia tal como aparece en el programa. Ejemplo: Minuto de silencio.",
"Duración (min:s)":"Tiempo previsto que dura el punto, en minutos:segundos. Ejemplo: 4:00 para cuatro minutos. También acepta solo segundos (240). El inicio del punto siguiente se calcula sumando esta duración.",
"Inicio previsto":"Calculado, no se digita. Es la hora de inicio de la ceremonia más las duraciones de los puntos anteriores. En vivo se reemplaza por la hora real y las demoras que usted registre.",
"Equipo":"Nombre del escuadrón o formación, como lo llama por radio. Ejemplo: Formación Kfir. En Pasadas, elija aquí el equipo que hace la pasada.",
"Clase e ícono":"Clase de la aeronave: combate, transporte, helicóptero, paracaidismo u otro. Define el ícono que se ve en las pasadas, en la línea de tiempo y en la animación del push.",
"Tipo de aeronave":"Modelo de la aeronave. Es informativo y no afecta el cálculo. Ejemplo: T-6C Texan II.",
"Vel. de pasada (kt)":"Velocidad de la pasada: la que el equipo mantiene constante desde el holding o el IP hasta la tribuna, sobre el terreno, en nudos. Con ella se calcula la hora de push. No es la velocidad crucero para llegar al holding; esa va en la sección 1 (Step y takeoff). Ejemplo: 200.",
"Vel. crucero (kt)":"Velocidad a la que el equipo viaja desde el aeródromo de salida hasta el holding, distinta de la velocidad de pasada de la sección 2 (Equipos). Es opcional: si la deja en 0 o vacía, se usa la velocidad de pasada del equipo. Solo sirve para calcular el takeoff y el step; no afecta la hora de push ni los tiempos de la pasada. Ejemplo: 220.",
"Reacción (s)":"Segundos entre su orden de push y el momento en que la aeronave cruza el punto de salida (holding o IP) rumbo a la tribuna. Incluye el tiempo de radio y de acomodarse. Si la aeronave cruza el punto justo al recibir la orden, escriba 0.",
"Color":"Color con el que se identifica al equipo en la pantalla En vivo.",
"Holding":"Nombre del punto de sostenimiento donde la aeronave espera la orden. Ejemplo: Holding ALFA.",
"IP":"Nombre del punto inicial (IP) de esta ruta. Es opcional: si lo deja vacío, toma el nombre del holding (Holding ALFA → IP ALFA).",
"Holding → IP (NM)":"Distancia en millas náuticas desde el holding hasta el IP, medida sobre la ruta que vuela la aeronave. Ejemplo: 5. Acepta decimales con punto o coma (4,5).",
"IP → tribuna (NM)":"Distancia en millas náuticas desde el IP hasta el punto de paso frente a la tribuna. Ejemplo: 3. Acepta decimales con punto o coma.",
"Viento en ruta (kt)":"Componente de viento sobre la ruta, en nudos. Positivo si es de frente (la aeronave tarda más), negativo si es de cola. Se resta de la velocidad en los dos tramos. Deje 0 si la velocidad del equipo ya es sobre el terreno.",
"Pasa en el punto":"Punto de la ceremonia durante el cual la aeronave debe pasar sobre la tribuna.",
"Momento":"Dos formas de decir cuándo pasa la aeronave. «Minuto del punto»: tiempo desde que empieza el punto (si el punto dura 3:00 y escribe 2:00, pasa a los 2 minutos); se corre solo si la ceremonia se adelanta o atrasa. «Hora local exacta»: escribe la hora (24 h) y queda fija aunque la ceremonia se corra. También puede usar «A un % del punto» o «Antes del final». Al cambiar de forma, la hora sobre tribuna se conserva.",
"Hora exacta":"Solo para el momento «Hora exacta (manual)». Hora en formato de 24 horas con segundos a la que la aeronave debe pasar sobre la tribuna. Ejemplo: 10:07:00. No cambia con demoras de la ceremonia.",
"Minuto del punto":"Minutos:segundos desde que EMPIEZA el punto hasta que la aeronave cruza la tribuna. Ejemplo: punto de 3:00, escriba 2:00 para que pase a los 2 minutos. 0:00 = justo al inicio.",
"Hora local":"Hora local en formato de 24 horas con segundos a la que la aeronave debe pasar sobre la tribuna. Ejemplo: 10:07:00. No cambia con demoras de la ceremonia.",
"Tiempo antes del final":"Minutos:segundos ANTES de que TERMINE el punto en que la aeronave cruza la tribuna. Ejemplo: 0:20 = pasa 20 s antes de acabar el punto. 0:00 = justo al final.",
"% del punto":"Porcentaje de la duración total del punto en que pasa la aeronave. 0 = al inicio, 50 = a la mitad, 100 = al final. Ejemplo: punto de 4:00 y 25 % = pasa en el minuto 1:00. Se ajusta solo si el punto se alarga o se acorta.",
"Posición en el punto":"Cuánto tiempo del punto ha transcurrido cuando la aeronave pasa sobre la tribuna, sobre la duración total del punto. Si queda en rojo, la pasada cae fuera del punto.",
"Desfase u hora":"Tiempo en minutos:segundos respecto al momento elegido. Ejemplo: Minuto de silencio, «Después del inicio», 0:30 = la aeronave pasa 30 s después de que empieza el punto. Con 0:00 pasa justo al inicio o al final. Si el momento es «Hora exacta», aquí se escribe la hora en 24 horas con segundos (ejemplo 10:07:00) y queda fija aunque la ceremonia se corra.",
"Ruta":"Holding e IP que usa esta pasada. De aquí salen las distancias y el viento.",
"Push desde":"Dónde está la aeronave cuando usted da la orden. Holding: recorre holding → IP → tribuna. IP: ya está en el IP y solo recorre IP → tribuna.",
"Vuelo":"Calculado, no se digita. Distancia ÷ velocidad sobre el terreno. No incluye la reacción.",
"Sobre tribuna":"Calculado, no se digita. Hora a la que la aeronave debe pasar sobre la tribuna según el punto, el momento y el desfase.",
"Hora de push":"Calculado, no se digita. Hora sobre tribuna − tiempo de vuelo − reacción. A esta hora debe dar la orden.",
"Inicio real":"Hora a la que empieza este punto. Si la ceremonia se corre, escriba aquí la hora real (o toque «Inicia ahora») y todos los puntos y pushes siguientes se recalculan.",
"Demora":"Alarga o acorta este punto por una contingencia. Cada toque suma o resta tiempo a su duración y corre todo lo que sigue. No cambia la duración guardada en el Plan."
};

function applyInput(t,final){
  var c=t.dataset.c,f=t.dataset.f,ty=t.dataset.t,v;
  if(ty==="num")v=f==="vcr"&&!String(t.value).trim()?0:parseNum(t.value);else if(ty==="dur")v=parseDur(t.value);else if(ty==="id")v=+t.value;
  else if(ty==="otime"){if(!String(t.value).trim())v=null;else{v=hms(t.value,!final);if(!isFinite(v)&&!final){t.setAttribute("aria-invalid","false");return;}}}
  else if(ty==="time"){v=hms(t.value,!final);if(!isFinite(v)&&!final){t.setAttribute("aria-invalid","false");return;}}else v=t.value;
  var bad=(typeof v==="number"&&!isFinite(v))||((f==="vel"&&!(v>0))||(f==="vcr"&&v<0))||((f==="dur"||f==="off"||f==="margen"||f==="preaviso"||f==="sep"||f==="tra"||f==="dbase"||f==="holdMin"||f==="stepMin"||f==="alMin"||f==="dHI"||f==="dIT")&&v<0)||(f==="pct"&&(v<0||v>100))||(f==="play"&&String(v).trim()&&playMin(v)==null);
  t.setAttribute("aria-invalid",bad?"true":"false");
  if(bad)return;
  var o=c==="cfg"?S:byId(S[c],+t.dataset.id);if(!o)return;
  if(c==="pasadas"&&f==="ancla"&&v!=="hora"&&o.ancla!==v){var Cz=calc(),pz=byId(Cz.ps,o.id);if(pz&&pz.ok&&pz.ci>=0){var s0=Cz.st[pz.ci],e0=Cz.en[pz.ci],L=e0-s0,T=Math.min(Math.max(pz.tot,s0),e0);
    if(v==="inicio")o.off=Math.round(T-s0);else if(v==="fin")o.off=Math.round(e0-T);else if(v==="pct")o.pct=L>0?Math.round((T-s0)/L*100):50;}}
  if(c==="pasadas"&&f==="ancla"&&v==="pct"&&o.pct==null)o.pct=50;
  if(c==="pasadas"&&f==="ancla"&&v==="hora"&&o.ancla!=="hora"){var pc=byId(calc().ps,o.id);o.autoAncla=o.ancla;o.hora=pc&&pc.ok?Math.round(pc.tot):(o.hora!=null?o.hora:S.inicio);}
  o[f]=v;S.ejemplo=false;touch();refreshCalc();
  if(final&&ty==="dur")t.value=fmtDur(v);if(final&&ty==="time")t.value=fmtClock(v);if(final&&ty==="otime")t.value=v==null?"":fmtClock(v);
}

  }
  else if(a==="clear")twoStep(b,"clear","Toque otra vez para borrar",function(){S.marks=null;norm(S);prevD={};touch();renderPlan();});
  else if(a==="reset"){var nx=defaults();nx.ejemplo=false;nx.titulo=uniqTitle("Evento de ejemplo");evSwitch(nx,"Se abrió un evento de ejemplo para practicar. Sus otros eventos no cambiaron.");if(tab==="vivo")renderLive();}
  else if(a==="ev-pick-w"){tab="plan";showTab();var pw=document.getElementById("ev-pick");if(pw)pw.click();}
  else if(a==="save")saveNow(b);
  else if(a==="adv"){UI.adv=!UI.adv;try{localStorage.setItem(KEY+"-ui",JSON.stringify(UI));}catch(x){}renderPlan();}
  else if(a==="ev-new"){var n=defaults();n.ejemplo=false;n.titulo=uniqTitle("Nuevo evento");evSwitch(n,"Evento nuevo creado con datos de referencia. Cámbielos por los suyos. Sus otros eventos siguen guardados.");}
  else if(a==="ev-dup"){var c2=JSON.parse(JSON.stringify(S));c2.eid=null;c2.titulo=S.titulo+" (copia)";c2.ejemplo=false;c2.marks=null;c2.log=[];evSwitch(c2,"Evento duplicado.");}
  else if(a==="ev-export")evBox("export");
  else if(a==="ev-pick"){var pk=document.getElementById("ev-pick");if(pk){pk.value="";pk.click();}}
  else if(a==="ev-import")evBox("import");
  else if(a==="ev-copy")copyTxt(document.getElementById("ev-io").value,function(){evMsg("Texto copiado.");});
  else if(a==="dl-html"||a==="ev-dl")downloadHtml();
  else if(a==="ev-paste")importTxt(document.getElementById("ev-io").value);
  else if(a==="ev-del")twoStep(b,"evdel","Toque otra vez para eliminar",function(){var L=lib();cDelEvent(S.eid);delete L[S.eid];libSave(L);var k=Object.keys(L);clearTimeout(saveT);S=norm(k.length?L[k[0]]:defaults());prevD={};S.rev=Date.now();saveLocal();renderPlan();evMsg("Evento eliminado.");});
  else if(a==="log-copy"){var lt=document.getElementById("log-io");lt.hidden=false;lt.value=logText();lt.select();copyTxt(lt.value,function(){});}
});
function buildDoc(){
  S.rev=Date.now();saveLocal();
  var json=JSON.stringify(S).replace(/</g,"\\u003c");
  return '<!DOCTYPE html>\n<html lang="es"><head>'+HEAD+'<style id="css">'+document.getElementById("css").textContent+'</style></head><body><div id="root"></div><script type="application/json" id="state">'+json+'<\/script><script id="app">'+document.getElementById("app").textContent+'<\/script></body></html>';
}
function fileName(){return (String(S.titulo||"").trim().replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g," ")||"evento")+".html";}
function downloadHtml(){
  var doc=buildDoc(),fn=fileName();
  function viaLink(){try{var an=document.createElement("a");an.href=URL.createObjectURL(new Blob([doc],{type:"text/html"}));an.download=fn;document.body.appendChild(an);an.click();an.remove();svMsg={s:"ok",t:"✔ Se descargó «"+fn+"». Ábralo en cualquier navegador: trae el programa y todos los datos."};}catch(x){svMsg={s:"err",t:"No se pudo descargar desde aquí. Abra la aplicación como archivo HTML en el navegador y repita."};}svPaint();evMsg(svMsg.s==="ok"?"✔ Archivo descargado.":"No se pudo descargar.");}
  if(window.claude&&window.claude.use){
    window.claude.use("downloads").then(function(d){
      if(!d){viaLink();return;}
      d.save({filename:fn,data:doc}).then(function(){svMsg={s:"ok",t:"✔ Se guardó «"+fn+"». Ábralo en cualquier navegador: trae el programa y todos los datos."};svPaint();evMsg("✔ Archivo guardado.");})
       .catch(function(e){svMsg={s:e&&e.code==="declined"?"pend":"err",t:e&&e.code==="declined"?"Descarga cancelada.":"No se pudo descargar desde aquí ("+((e&&e.code)||"error")+")."};svPaint();evMsg(svMsg.t);});
    }).catch(viaLink);
  }else viaLink();
}
function savePlan(b){
  if(!artifact)return;
  var doc=buildDoc();
  artifact.publish(doc).then(function(){svMsg={s:"ok",t:"✔ Guardado «"+S.titulo+"» a las "+lastSave+" en este dispositivo y en la página."};svPaint();})
    .catch(function(){svPaint();});
}

})();
